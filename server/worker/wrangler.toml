name = "checards"
main = "src/index.js"
compatibility_date = "2026-09-25"

# Custom domain - uncomment after first deploy, or add in the dashboard:
# routes = [ { pattern = "checards.sighton.ca", custom_domain = true } ]

rules = [ { type = "CompiledWasm", globs = ["**/*.wasm"] } ]

# Serve the committed browser build from the same Worker as the API and sockets.
# Worker-first routing keeps /api/* and /ws/* in the Worker; all other paths
# fall through to the static assets binding in src/index.js.
[assets]
directory = "../../web/dist"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Lobby"]

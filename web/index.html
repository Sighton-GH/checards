<!doctype html>
<html><head><meta charset="utf-8"><title>Checards - play the engine</title>
<style>
body{flex-wrap:wrap;font-family:system-ui,sans-serif;background:#1d2126;color:#e8e8e8;margin:0;display:flex;gap:20px;padding:16px}
#left{flex:0 0 auto}#right{flex:1;min-width:280px;max-width:420px}
table{border-collapse:collapse}td{width:78px;height:78px;border:1px solid #444;vertical-align:top;padding:2px;background:#2b3036;cursor:pointer;position:relative}
td.home{background:#2f3a33}td.sel{outline:3px solid #f5c542;outline-offset:-3px}td.dest{background:#3d4f6b}td.combat{box-shadow:inset 0 0 0 3px #d9534f}
.coord{position:absolute;right:3px;bottom:1px;font-size:10px;color:#777}
.card{display:inline-block;font-size:13px;font-weight:600;padding:1px 4px;margin:1px;border-radius:3px}
.r{background:#b33a3a;color:#fff}.b{background:#111;color:#ddd;border:1px solid #666}.hid{opacity:.85;font-style:italic}.rev{outline:2px solid #f5c542;outline-offset:0}.rev::after{content:'\1F441';font-size:10px;margin-left:2px}#deadp{font-size:13px;background:#15181b;padding:6px;border-radius:4px;margin-bottom:8px}#deadp .card{font-size:12px}
button{background:#3a4450;color:#eee;border:1px solid #556;border-radius:4px;padding:5px 9px;margin:2px;cursor:pointer}button:hover{background:#4a5666}button[aria-pressed="true"]{background:#385947;border-color:#88bb98}
select{background:#2b3036;color:#eee;border:1px solid #556;padding:3px}
#status{font-size:16px;margin:8px 0;min-height:22px}#log{font-size:12px;max-height:340px;overflow:auto;background:#15181b;padding:6px;border-radius:4px;white-space:pre-wrap}
.row{margin:6px 0}.muted{color:#999;font-size:12px}
</style></head><body>
<div id="left"><div class="row" style="max-width:600px">
Opponent <select id="model"><option value="patient:/models/champion-it32.bin">Champion (it32: patient strategy + deep-target net)</option><option value="patient:/models/champion-it31.bin">it31 (patient strategy + hybrid-trained net)</option><option value="patient:/models/champion-it29.bin">it30 (patient strategy + it29 net)</option><option value="/models/champion-it29.bin">it29 (search only)</option><option value="/models/champion-it28.bin">it28 (~4940 games)</option><option value="/models/cq-3000.bin">3000-game checkpoint</option><option value="/models/your-net.bin">Your net (checards_model.bin)</option><option value="/models/old-champion.bin">Old champion (cycle 4)</option></select>
Strength <select id="iters"><option value="250" selected>Champion default (250 sims/move)</option><option value="60">Gate strength (60 sims/move)</option><option value="400">Strong (400)</option><option value="2000">Very strong (2000)</option></select>
You play <select id="side"><option value="1">Red (moves first)</option><option value="0">Black</option></select>
<button id="newg">New game</button><button id="music" type="button" aria-pressed="false" title="Music is off until you turn it on">Music: off</button></div>
<div id="status">Loading engine...</div>
<table id="board"></table>
<div class="row" id="actions"></div>
<div class="muted">Your home rows are at the bottom. Hidden enemy cards show as ?. Yellow outline + eye = revealed in combat (the other side has seen it; applies to your cards too).</div>
</div>
<div id="right"><div id="deadp"></div><div class="row"><b>Game log</b> <button id="dl">Download game log (JSON)</button> <button id="dlall">Download all saved games</button></div>
<div id="log"></div><div class="muted" id="saved"></div></div>
<script>/*ENGINE*/</script>
<script>
let M, S, sel=null, gameId=null, aiBusy=false;
// Source-page URLs are relative; build.sh embeds the same audio into the single-file release.
const AUDIO_FILES=/*AUDIO_FILES*/{"menu":["audio/checards-menu.ogg","audio/checards-menu.mp3"],"game":["audio/checards-game.ogg","audio/checards-game.mp3"],"win":["audio/checards-win.ogg","audio/checards-win.mp3"],"lose":["audio/checards-lose.ogg","audio/checards-lose.mp3"]};
const musicTracks={};let musicOn=false, musicPhase=null, musicResult=null;
for(const [key,[ogg,mp3]] of Object.entries(AUDIO_FILES)){
 const a=new Audio();a.preload='none';a.loop=key==='menu'||key==='game';a.volume=key==='menu'?.24:key==='game'?.19:.33;
 const sourceOgg=document.createElement('source');sourceOgg.src=ogg;sourceOgg.type='audio/ogg';a.appendChild(sourceOgg);
 const sourceMp3=document.createElement('source');sourceMp3.src=mp3;sourceMp3.type='audio/mpeg';a.appendChild(sourceMp3);
 musicTracks[key]=a;
}
let currentMusic=null;
function playMusic(key){
 if(currentMusic===key)return;
 for(const track of Object.values(musicTracks)){track.pause();track.currentTime=0}
 currentMusic=key;if(!key||!musicOn)return;
 // Browsers may reject autoplay: only a click on Music starts playback.
 musicTracks[key].play().catch(()=>{currentMusic=null});
}
function updateMusic(){
 if(!musicOn){playMusic(null);return}
 let key=musicPhase==='play'?'game':'menu';
 if(musicPhase==='over')key=musicResult===1+S.human?'win':(musicResult===1+(1-S.human)?'lose':null);
 playMusic(key);
}
function setMusicState(phase,result){
 if(musicPhase===phase && (phase!=='over'||musicResult===result))return;
 musicPhase=phase;musicResult=result;updateMusic();
}

const RES={1:'Red wins',2:'Black wins',3:'Draw (mutual)',4:'Draw (inactivity)',5:'Aborted (ply safety limit)'};
const $=id=>document.getElementById(id);
const st=()=>JSON.parse(M.UTF8ToString(M._cg_state()));
const cell=(x,y)=>S.board[x*7+y];
function cardHtml(c){if(c.name)c.name=c.name.replace('Jkr*','Joker');const cls=c.owner==0?'r':'b';if(!c.name)return `<span class="card ${cls} hid">?</span>`;return `<span class="card ${cls}${c.revealed?' rev':''}">${c.name}</span>`}
const DECK=f=>{const su=f==0?['D','H']:['C','S'];const d=['Joker','A'+su[0],'A'+su[1]];for(const r of ['9','10','J','Q','K'])for(const x of su)d.push(r+x);return d};
const nm=n=>n.replace('Jkr*','Joker');
function renderDead(){const D=[[],[]];let L=[];try{L=JSON.parse(M.UTF8ToString(M._cg_log()))}catch(e){}
 for(const ev of L)for(const c of (ev.combat||[])){const a=c.attacker,d=1-a;if(c.attackerDied)c.att.forEach(n=>D[a].push(nm(n)));if(c.defenderDied)c.def.forEach(n=>D[d].push(nm(n)))}
 const h=S.human,ai=1-h,chip=(n,f)=>`<span class="card ${f==0?'r':'b'}">${n}</span>`;
 const seen=new Set(D[ai]);if(S.phase!='over')for(const t of S.board)for(const c of t)if(c.owner==ai&&c.name)seen.add(nm(c.name));
 const unseen=S.phase=='play'?DECK(ai).filter(n=>!seen.has(n)):[];
 $('deadp').innerHTML=`<b>Dead cards</b><div>You: ${D[h].map(n=>chip(n,h)).join('')||'<span class="muted">none</span>'}</div><div>AI: ${D[ai].map(n=>chip(n,ai)).join('')||'<span class="muted">none</span>'}</div>`+
  (S.phase=='play'?`<div style="margin-top:4px">AI cards never revealed (hidden on the board or still in its draw pile): ${unseen.map(n=>chip(n,ai)).join('')}</div>`:'')}
function logLine(t){$('log').textContent+=t+'\n';$('log').scrollTop=1e9}
function save(){if(!gameId)return;const all=JSON.parse(localStorage.getItem('checardsGames')||'{}');all[gameId]=JSON.parse(M.UTF8ToString(M._cg_log()));localStorage.setItem('checardsGames',JSON.stringify(all));$('saved').textContent=Object.keys(all).length+' game(s) saved in this browser.'}
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=name;a.click()}
function describe(ev){if(ev.ev=='act'){const who=ev.mover==S.human?'You':'AI';const a=ev.a;let t=a.spawn?`${who}: spawn at column ${a.to[0]}${ev.mover==S.human&&ev.spawned?' ('+ev.spawned+')':''}`:`${who}: ${ev.mover==S.human?a.card+' ':''}(${a.from})->(${a.to})`;
 for(const c of ev.combat)t+=`\n   combat at (${c.at}): ${c.att.join(' ')} vs ${c.def.join(' ')} - attacker ${c.attackerDied?'destroyed':'survives'}, defender ${c.defenderDied?'destroyed':'survives'}`;return t}
 if(ev.ev=='pass')return (ev.mover==S.human?'You':'AI')+': no legal action, turn passes';if(ev.ev=='end')return 'GAME OVER: '+RES[ev.result];return null}
let logSeen=0;function syncLog(){const L=JSON.parse(M.UTF8ToString(M._cg_log()));for(;logSeen<L.length;logSeen++){const d=describe(L[logSeen]);if(d)logLine(d)}}
function render(){S=st();const t=$('board');t.innerHTML='';const hr=S.human==0;const combatSq=new Set((S.events||[]).map(e=>e.at.join(',')));
 const dests=new Set();if(sel)for(const a of S.legal)if(!a.spawn&&a.from[0]==sel[0]&&a.from[1]==sel[1])dests.add(a.to.join(','));
 for(let r=0;r<7;r++){const tr=t.insertRow();const y=hr?6-r:r;for(let x=0;x<7;x++){const td=tr.insertCell();const home=hr?y<=2:y>=4;
  if(home)td.classList.add('home');if(sel&&sel[0]==x&&sel[1]==y)td.classList.add('sel');if(dests.has(x+','+y))td.classList.add('dest');if(combatSq.has(x+','+y))td.classList.add('combat');
  td.innerHTML=cell(x,y).map(cardHtml).join('')+`<span class="coord">${x},${y}</span>`;td.onclick=()=>click(x,y)}}
 const A=$('actions');A.innerHTML='';let s='';
 if(S.phase=='setup_place')s=`Setup: click a square in your home rows to place ${S.pending}.`;
 else if(S.phase=='setup_draft'){s='Setup: pick your next card to place.';S.pool.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{M._cg_draft(i);render();maybeAI()};A.appendChild(b)})}
 else if(S.phase=='play'){const mine=S.mover==S.human;s=`Turn ${S.turn} - ${mine?'your move':'AI thinking...'} | moves left ${S.movesRemaining} | draw piles: you ${S.draw[S.human]}, AI ${S.draw[1-S.human]}`;
  if(mine){if(S.legal.length==0){const b=document.createElement('button');b.textContent='No legal action - pass';b.onclick=()=>act(0);A.appendChild(b)}
   S.legal.forEach((a,i)=>{if(a.spawn){const b=document.createElement('button');b.textContent='Spawn at column '+a.to[0];b.onclick=()=>act(i);A.appendChild(b)}});
   if(sel&&pendingDest){S.legal.forEach((a,i)=>{if(!a.spawn&&a.from[0]==sel[0]&&a.from[1]==sel[1]&&a.to[0]==pendingDest[0]&&a.to[1]==pendingDest[1]){const b=document.createElement('button');b.textContent='Move '+a.card;b.onclick=()=>act(i);A.appendChild(b)}})}}}
 else if(S.phase=='over')s='Game over: '+RES[S.result]+' - log saved.';
 $('status').textContent=s;setMusicState(S.phase,S.result);renderDead()}
let pendingDest=null;
function act(i){pendingDest=null;sel=null;M._cg_human_act(i);syncLog();save();render();maybeAI()}
function click(x,y){if(!S)return;if(S.phase=='setup_place'){if(!M._cg_place(x,y)){$('status').textContent='Not a legal setup square.';return}render();maybeAI();return}
 if(S.phase!='play'||S.mover!=S.human)return;
 if(sel){const m=[];S.legal.forEach((a,i)=>{if(!a.spawn&&a.from[0]==sel[0]&&a.from[1]==sel[1]&&a.to[0]==x&&a.to[1]==y)m.push(i)});
  if(m.length==1)return act(m[0]);if(m.length>1){pendingDest=[x,y];render();$('status').textContent='Several of your cards can make that move - pick which one below.';return}}
 pendingDest=null;sel=S.legal.some(a=>!a.spawn&&a.from[0]==x&&a.from[1]==y)?[x,y]:null;render()}
function maybeAI(){S=st();if(S.phase=='play'&&S.mover!=S.human&&!aiBusy){aiBusy=true;setTimeout(()=>{M._cg_ai_step();aiBusy=false;syncLog();save();render();maybeAI()},350)}
 else if(S.phase=='play'&&S.mover==S.human){syncLog();save()} else if(S.phase=='over'){syncLog();save();render()}}
function newGame(){gameId=new Date().toISOString();logSeen=0;$('log').textContent='';sel=null;pendingDest=null;
 const seed=(Math.random()*4e9)>>>0;M.ccall('cg_new','number',['string','number','number','number'],[$('model').value,+$('side').value,+$('iters').value,seed]);syncLog();render();maybeAI()}
$('music').onclick=()=>{
 musicOn=!musicOn;const b=$('music');b.textContent='Music: '+(musicOn?'on':'off');b.setAttribute('aria-pressed',String(musicOn));
 // Reset when enabling so the selected loop starts at the beginning.
 if(musicOn){currentMusic=null;updateMusic()}else playMusic(null);
};
$('newg').onclick=newGame;$('dl').onclick=()=>download('checards-game-'+gameId+'.json',JSON.parse(M.UTF8ToString(M._cg_log())));
$('dlall').onclick=()=>download('checards-all-games.json',JSON.parse(localStorage.getItem('checardsGames')||'{}'));
function autotest(n){let k=0;const tick=()=>{S=st();if(k++>=n||S.phase=='over'){render();return}
 if(S.phase=='setup_place'){while(!M._cg_place(Math.floor(Math.random()*7),S.human==0?Math.floor(Math.random()*3):4+Math.floor(Math.random()*3)));}
 else if(S.phase=='setup_draft')M._cg_draft(0);else if(S.mover==S.human)M._cg_human_act(S.legal.length?Math.floor(Math.random()*S.legal.length):0);else M._cg_ai_step();
 syncLog();tick()};tick();const f=S.legal.find(a=>!a.spawn);if(f){sel=f.from;render()}}
CheckardsEngine().then(m=>{M=m;newGame();const q=new URLSearchParams(location.search);if(q.get('autotest')){aiBusy=true;autotest(+q.get('autotest'))}});
</script></body></html>
